services:
  app:
    build: ./app
    container_name: php-app
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    volumes:
      - ./app:/var/www/html
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: php-mysql-data
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
