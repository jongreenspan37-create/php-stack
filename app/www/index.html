<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Scripts</title>
    <!-- Tailwind CSS from a CDN: utility classes like "flex gap-2" style elements directly in the HTML. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- preflight: false stops Tailwind resetting the browser's default styles, so style.css still applies. -->
    <script>
      tailwind.config = {
      corePlugins: { preflight: false },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      .result-div {
        margin: 2rem 4rem;
        font-size: large;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
      <li><a href="index.html">Main Page</a></li>
      <li><a href="list-manipulation.html">List Manipulation</a></li>
      <li><a href="database-interaction.html">Database Interaction</a></li>
      <li><a href="formula1.php">Formula 1</a></li>
      <li><a href="learning.php">Learning PHP</a></li>
      </ul>
    </nav>

    <header>
      <h1 class="text-center text-slate-600">Vanilla HTML/CSS/Tailwind CSS/Javascript - PHP - MySQL Stack</h1>
      <p >
        Each button imports a script in <code>scripts/</code> and calls the
        function matching its name.
      </p>
    </header>

    <!-- Each form below is handled by the JavaScript at the bottom of the page:
         it sends the values to /api/run/<file>/<function> and shows the JSON reply. -->
    <form id="add-numbers">
      <div class="flex gap-2">
        <input class="w-20 h-10 text-xl rounded-lg" type="number" step="any" name="x" required />
        <input class="w-20 h-10 text-xl rounded-lg" type="number" step="any" name="y" required />
        <input class="w-20 h-10 text-xl rounded-lg" type="number" step="any" name="a" required />
      </div>
      <button class= "mt-2" type="submit">Add Numbers</button>
    </form>

    <!-- Empty boxes that the JavaScript fills in with results. -->
    <div class="result-div" id="result-1"></div>
    <div class="result-div" id="result-2"></div>
    <div class="result-div" id="result-3"></div>

    <form id="add-strings">
      <div class="flex gap-2">
        <input class="w-32 h-10 text-lg" type="text" maxlength="100" name="a" required />
        <input class="w-32 h-10 text-lg" type="text" maxlength="100" name="b" required />
        <input class="w-32 h-10 text-lg" type="text" maxlength="100" name="c" required />
      </div>
      <button class="mt-2" type="submit">Add Words</button>
    </form>

    <div class="result-div" id="result-error" style="color: red"></div>
    <div class="result-div" id="string-error"></div>
    <div class="result-div" id="string-result"></div>

    <div class="result-div">
      <!-- data-script isn't used here (script.js isn't loaded on this page); the click handler below does the work. -->
      <button id="add-phrase" data-script="basic/add_phrase">
        Add a phrase
      </button>
      <div class="result-div" style="color: purple" id="display-phrase"></div>

      <div class="result-div" id="slice"></div>
    </div>

    <form id="date-manipulation">
      <div>
        <label for="date">Pick a date</label>
        <input class="h-10" type="date" name="date" required />
      </div>
      <label for="number">Add a number and period to give next date due</label>
      <input class="h-10" type="number" name="amount" required />
      <select  class="h-10" name="unit" required>
        <option value="day">Day(s)</option>
        <option value="month">Month(s)</option>
        <option value="year">Year(s)</option>
      </select>

      <button type="submit">Next Date</button>
    </form>

    <div
      class="result-div"
      id="date-manipulation-error"
      style="color: red"
    ></div>
    <div class="result-div" id="date-manipulation-result"></div>

    <script>
      // document.getElementById finds an element by its id="..." attribute.
      const addNumbers = document.getElementById("add-numbers");
      const resultError = document.getElementById("result-error");
      const result1 = document.getElementById("result-1");
      const result2 = document.getElementById("result-2");
      const result3 = document.getElementById("result-3");

      // Runs when the form is submitted. (e) => { ... } is an arrow function.
      addNumbers.addEventListener("submit", (e) => {
        // Stop the browser's normal form submit (which would reload the page).
        e.preventDefault();
        const form = e.target;
        resultError.textContent = "";
        result1.textContent = "";
        result2.textContent = "";
        result3.textContent = "";

        // form.x is the <input name="x">. Inputs always give text, so convert to a number.
        const x = Number(form.x.value);
        const y = Number(form.y.value);
        const a = Number(form.a.value);

        // Client-side check: fast feedback only, not security.
        // The backend re-validates because this can be bypassed.
        if (![x, y, a].every(Number.isFinite)) {
          resultError.textContent = "x, y, and a must all be valid numbers.";
          return;
        }

        // Send the numbers to the server as JSON. fetch returns a Promise; each
        // .then() runs when the previous step finishes.
        fetch("/api/run/basic/add_numbers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ x, y, a }),
        })
          // Parse the response body as JSON.
          .then((res) => res.json())
          .then((data) => {
            // The server returns {"error": ...} when the input is invalid.
            if (data.error) {
              resultError.textContent = data.error;
              return;
            }
            // Success returns an array: [sum, "true"/"false"].
            result1.textContent = "Result = " + data[0];
            result2.textContent =
              "Raw result = " +
              data +
              " Extracting parts = " +
              data[0] +
              " " +
              data[1];
            ///Increased risk !
            result3.innerHTML = `<div>Temperal literal =  <strong>${data[0]} ${data[1]}</strong></span></div>`;
          });
      });

      const addStrings = document.getElementById("add-strings");
      const stringError = document.getElementById("string-error");
      const stringResult = document.getElementById("string-result");

      addStrings.addEventListener("submit", (e) => {
        e.preventDefault();
        const form = e.target;
        stringError.textContent = "";
        stringResult.textContent = "";

        const a = form.a.value.trim();
        const b = form.b.value.trim();
        const c = form.c.value.trim();

        // Client-side check: fast feedback only, not security.
        // The backend re-validates because this can be bypassed.
        if (![a, b, c].every((v) => v.length > 0 && v.length <= 100)) {
          stringError.textContent = "Each word must be 1-100 characters.";
          return;
        }

        fetch("/api/run/basic/add_strings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ a, b, c }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              stringError.textContent = data.error;
              return;
            }
            // textContent (not innerHTML) is what actually stops XSS here:
            // the browser renders this as plain text, so tags can't execute.
            stringResult.textContent = data.result;
          });
      });

      const addPhrase = document.getElementById("add-phrase");
      const displayPhrase = document.getElementById("display-phrase");
      const displaySlice = document.getElementById("slice");

      // Two requests in a row: get the phrase, then send it to string_func.
      addPhrase.addEventListener("click", () => {
        displayPhrase.textContent = "Fetching ....";
        fetch("/api/run/basic/add_phrase")
          .then((res) => res.json())
          .then((data) => {
            const phrase = data;
            displayPhrase.textContent = "'" + phrase + "'";

            if (phrase) {
              console.log(phrase);
              // Returning the second fetch chains it onto the first.
              return fetch("/api/run/basic/string_func", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(phrase),
              })
                .then((res) => res.json())
                .then((data) => {
                  console.log(data);
                  //Danger using innerHTML
                  displaySlice.innerHTML = `This is a slice of the phrase 
                                    <div class='result-div'style='color:purple'> 
                                        "${data.slice}" </div>  
                                        and this shows CAPATILISATION of the string 
                                        <div class='result-div' style='color:purple'>${data.upper}</div>`;
                });
            }
          });
      });

      // Turns "2024-02-29" into "29 February 2024". The "T00:00:00Z" + timeZone UTC
      // stop the date shifting by a day in some time zones.
      function formatHumanDate(isoDate) {
        const date = new Date(isoDate + "T00:00:00Z");
        return date.toLocaleDateString("en-GB", {
          day: "numeric",
          month: "long",
          year: "numeric",
          timeZone: "UTC",
        });
      }

      const dateManipulation = document.getElementById("date-manipulation");
      const dateManipulationError = document.getElementById(
        "date-manipulation-error",
      );
      const dateManipulationResult = document.getElementById(
        "date-manipulation-result",
      );

      // Sends {date, amount, unit} to adjust_date and shows the new date.
      dateManipulation.addEventListener("submit", (e) => {
        e.preventDefault();
        const form = e.target;
        dateManipulationError.textContent = "";
        dateManipulationResult.textContent = "";

        const dateValue = form.date.value;
        const amount = Number(form.amount.value);
        const unit = form.unit.value;

        // Client-side check: fast feedback only, not security.
        // The backend re-validates because this can be bypassed.
        if (!dateValue || !Number.isFinite(amount)) {
          dateManipulationError.textContent =
            "Enter a date and a valid amount.";
          return;
        }

        fetch("/api/run/date_manipulation/adjust_date", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: dateValue, amount, unit }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              dateManipulationError.textContent = data.error;
              return;
            }
            dateManipulationResult.textContent =
              "Result: " + formatHumanDate(data.result);
          });
      });
    </script>
  </body>
</html>
