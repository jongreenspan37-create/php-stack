<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Interaction</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Main Page</a>
      <a href="list-manipulation.html">List Manipulation</a>
      <a href="database-interaction.html">Database Interaction</a>
    </nav>
    <main>
      <h1>Database Interaction</h1>

      <button data-script="health/health">Check DB Connection</button>
      <button data-script="create_tables/create_tables">Create Tables</button>
      <button data-script="test/test_1">Test1</button>
      <button data-script="test/test_2">Test2</button>

      <h2>Roles</h2>
      <table id="roles-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Add / Edit Role</h3>
      <form id="add-role-form">
        <input type="text" name="id" placeholder="ID no.." required />
        <input type="text" name="name" placeholder="Role name ...." required />

        <button type="submit">Add Role</button>
        <button type="button" id="cancel-role-edit" hidden>Cancel</button>
      </form>

      <h2>Users</h2>
      <table id="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Role</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Add / Edit User</h3>
      <form id="add-user-form">
        <input type="text" name="firstName" placeholder="First name" required />
        <input type="text" name="lastName" placeholder="Last name" required />
        <input type="email" name="email" placeholder="Email" required />
        <select name="roleId" id="user-role-select">
          <option value="">-- No role --</option>
        </select>
        <button type="submit">Add User</button>
        <button type="button" id="cancel-user-edit" hidden>Cancel</button>
      </form>

      <pre id="result"></pre>
    </main>
    <script src="script.js"></script>
  </body>
</html>
